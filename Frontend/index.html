<!doctype html>
<html>
  <head>
    <title>Socket.IO Test</title>
  </head>

  <body>
    <button id="ping">PING</button>
    <div id="messages"></div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>
      const socket = io("https://sockettesting.onrender.com", {
        transports: ["websocket"]
      });

      // Store the start time of every outstanding ping
      const pendingPings = new Map();

      document.getElementById("ping").addEventListener("click", () => {
        // Generate a unique ID for this ping
        const pingId = crypto.randomUUID();

        // Store when THIS particular ping was sent
        pendingPings.set(pingId, performance.now());

        socket.emit("ping-all", {
          pingId: pingId
        });
      });

      socket.on("ping-received", (data) => {
        const message = document.createElement("p");

        if (data.from === socket.id) {
          const startTime = pendingPings.get(data.pingId);

          if (startTime !== undefined) {
            const rtt = performance.now() - startTime;

            message.textContent =
              `You sent a ping! RTT: ${rtt.toFixed(2)} ms`;

            // We don't need this timestamp anymore
            pendingPings.delete(data.pingId);
          }
        } else {
          message.textContent =
            `${data.from} sent a ping!`;
        }

        document.getElementById("messages").appendChild(message);
      });

      socket.on("connect", () => {
        console.log("Connected using:", socket.io.engine.transport.name);
      });
    </script>
  </body>
</html>
