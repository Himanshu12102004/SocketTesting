<!doctype html>
<html>
  <head>
    <title>Socket.IO Test</title>
  </head>

  <body>
    <button id="ping">PING</button>
    <div id="messages"></div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>
      const socket = io(
        "https://dismantle-tweezers-augmented.ngrok-free.dev",
        {
          transports: ["websocket"],
        }
      );

      socket.on("connect", () => {
        console.log("Connected!");
        console.log("Transport:", socket.io.engine.transport.name);
      });

      document.getElementById("ping").addEventListener("click", () => {
        socket.emit("ping-all", {
          pingId: crypto.randomUUID(),
          timestamp: performance.now(),
        });
      });

      socket.on("ping-received", (data) => {
        const message = document.createElement("p");

        if (data.from === socket.id) {
          const rtt = performance.now() - data.timestamp;

          message.textContent =
            `You sent a ping! RTT: ${rtt.toFixed(2)} ms`;
        } else {
          message.textContent =
            `${data.from} sent a ping!`;
        }

        document.getElementById("messages").appendChild(message);
      });
    </script>
  </body>
</html>
