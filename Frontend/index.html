<!doctype html>
<html>
  <head>
    <title>Socket.IO Test</title>
  </head>

  <body>
    <button id="ping">PING</button>
    <div id="messages"></div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>
      const socket = io("https://sockettesting.onrender.com");

      let pingStartTime = null;

      document.getElementById("ping").addEventListener("click", () => {
        // Record the exact time before sending
        pingStartTime = performance.now();

        socket.emit("ping-all");
      });

      socket.on("ping-received", (data) => {
        const message = document.createElement("p");

        if (data.from === socket.id) {
          // Calculate round-trip time
          const rtt = performance.now() - pingStartTime;

          message.textContent =
            `You sent a ping! RTT: ${rtt.toFixed(2)} ms`;
        } else {
          message.textContent =
            `${data.from} sent a ping!`;
        }

        document.getElementById("messages").appendChild(message);
      });
    </script>
  </body>
</html>
